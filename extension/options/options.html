<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>插件设置 · 指纹浏览器工作台</title>
  <style>
    :root {
      --bg: #0a0e1a; --panel: #111828; --panel-2: #161f33;
      --border: #223050; --text: #e3eaf8; --muted: #7e8bab;
      --primary: #5b8cff; --ok: #2ecc8f; --danger: #ff5d6c;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg); color: var(--text);
      font: 14px/1.7 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
      padding: 32px; max-width: 560px; margin: 0 auto;
    }
    h1 { font-size: 20px; margin-bottom: 6px; }
    .sub { color: var(--muted); font-size: 13px; margin-bottom: 24px; }
    .card {
      background: var(--panel); border: 1px solid #1c2946;
      border-radius: 12px; padding: 20px 24px; margin-bottom: 16px;
    }
    h3 { font-size: 14px; margin-bottom: 12px; }
    label { display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: var(--muted); margin-bottom: 12px; }
    input {
      background: #0e1424; color: var(--text); border: 1px solid var(--border);
      border-radius: 8px; padding: 9px 12px; font-size: 13px; width: 100%;
    }
    input:focus { outline: none; border-color: var(--primary); }
    button {
      background: linear-gradient(135deg, #5b8cff, #7d5bff); color: #fff;
      border: none; border-radius: 8px; padding: 9px 18px;
      font-size: 13px; cursor: pointer; font-family: inherit;
    }
    button.ghost { background: var(--panel-2); border: 1px solid var(--border); color: var(--text); }
    .status { margin-top: 10px; font-size: 13px; min-height: 20px; }
    .status.ok { color: var(--ok); }
    .status.err { color: var(--danger); }
    ol { padding-left: 20px; color: var(--muted); font-size: 13px; }
    ol li { margin: 6px 0; }
    code { background: var(--panel-2); padding: 1px 6px; border-radius: 4px; font-size: 12px; }
  </style>
</head>
<body>
  <h1>插件设置</h1>
  <div class="sub">连接本机或局域网内的指纹浏览器工作台服务</div>

  <div class="card">
    <h3>连接配置</h3>
    <label>工作台地址
      <input id="serverUrl" placeholder="http://127.0.0.1:18080">
    </label>
    <label>API Key（认证开启时必填；也可用弹窗中的配对码自动获取）
      <input id="apiKey" type="password" placeholder="X-API-Key">
    </label>
    <div>
      <button id="btnSave">保存并测试连接</button>
      <button id="btnClear" class="ghost">清除配置</button>
    </div>
    <div id="status" class="status"></div>
  </div>

  <div class="card">
    <h3>使用说明</h3>
    <ol>
      <li>工作台未开启认证：填好地址点「保存并测试连接」即完成</li>
      <li>工作台开启了认证：到工作台「系统设置 → 生成插件配对码」，在插件弹窗输入配对码一键完成</li>
      <li>连接后：弹窗内可启停环境、把当前页发到任意环境；网页上<b>右键 → 在指纹环境中打开</b>可直接用链接启动环境</li>
      <li>连接远程工作台：把目标地址加入 manifest.json 的 <code>host_permissions</code> 后重新加载插件</li>
    </ol>
  </div>

  <script src="options.js"></script>
</body>
</html>
